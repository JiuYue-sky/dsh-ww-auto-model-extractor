name: CI Verify (DSH Plugin)

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Package Self-Audit (including native binary)
        run: python -c "from pathlib import Path; from core.self_audit import run_package_self_audit; r = run_package_self_audit(Path('.'), check_binary=True); print(r); assert r['status'] == 'PASS'"
      - name: Validate DSH Cordis Contract & Assets
        run: node tests/test_dsh_contract.mjs
      - name: Run Python Core Tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
